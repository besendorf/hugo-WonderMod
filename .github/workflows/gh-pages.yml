name: Build and security checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        hugo: ['0.158.0', '0.167.0']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: ${{ matrix.hugo }}
          extended: true
      - name: Test security validator
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and inspect fixture
        run: python3 tests/check_fixture.py
